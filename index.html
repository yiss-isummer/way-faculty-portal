// ── API ──
const API_URL = 'https://script.google.com/macros/s/AKfycbz6UPrdXAZlEbUCUHXlE-8BDFNufruftlrx_MAuvfI7wezGjW4-AtPf_k1FuEgHv1wX/exec';
function callApi(action, payload){
  // No Content-Type header → avoids CORS preflight (Apps Script doesn't handle OPTIONS)
  return fetch(API_URL, {
    method:'POST',
    body: JSON.stringify(Object.assign({action:action}, payload||{}))
  }).then(function(r){return r.json()});
}

// Drive 파일을 Apps Script로 proxy 다운로드 (session 검증 후 base64 → blob 다운로드 트리거)
function downloadProxyFile(fileType){
  var token = (typeof sessionStorage!=='undefined') ? sessionStorage.getItem('portal_token') : null;
  return callApi('downloadFile', {token:token, fileType:fileType}).then(function(res){
    if(!res || !res.success){
      alert((res && res.message) || 'Download failed');
      return;
    }
    var bin = atob(res.data);
    var bytes = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    var blob = new Blob([bytes], {type: res.mimeType || 'application/octet-stream'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = res.fileName || 'download';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url);}, 1000);
  }).catch(function(err){
    alert('Download failed: ' + (err && err.message ? err.message : err));
  });
}

// 대시보드 + 공지를 동시에 로드해서 faculty state로 머지될 객체 반환 (실패 시 null)
function loadPortalData(token){
  return Promise.all([
    callApi('getDashboard',{token:token}),
    callApi('getNotices',{token:token}),
    callApi('getEvents',{token:token})
  ]).then(function(results){
    var dash=results[0], nx=results[1], ex=results[2];
    if(dash.expired||nx.expired||(ex&&ex.expired)) return null;
    if(!dash.success) return null;
    return Object.assign({},MOCK,dash.faculty,{
      notices:(nx.success&&nx.notices)?nx.notices:[],
      events:(ex&&ex.success&&ex.events)?ex.events:[],
      documents: dash.documents || MOCK.documents,
      courses: dash.courses || MOCK.courses,
      housing: dash.housing || MOCK.housing,
      resources: dash.resources || MOCK.resources,
      salary: dash.salary || MOCK.salary,
      flight: dash.flight || MOCK.flight,
      calendar: dash.calendar || MOCK.calendar,
    });
  });
}

// ── Program Calendar helpers ──
var CAL_MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
// 분류별 색 팔레트 — 시트 E열의 분류가 등장 순서대로 색을 배정받음 (같은 분류 = 같은 색)
var CAL_COLORS=['#2563eb','#db2777','#0d9668','#7c3aed','#0891b2','#d97706'];
function calAlpha(hex,a){return 'rgba('+parseInt(hex.slice(1,3),16)+','+parseInt(hex.slice(3,5),16)+','+parseInt(hex.slice(5,7),16)+','+a+')'}
function calFmt(y,m,d){return y+'-'+('0'+m).slice(-2)+'-'+('0'+d).slice(-2)}
function calLabel(s){var p=s.split('-');return CAL_MONTHS[+p[1]-1]+' '+(+p[2])}
// RSVP 행사 일시(자유 텍스트) → YYYY-MM-DD 베스트에포트 파싱. 실패 시 null(달력에서 제외).
function calParseFree(s){
  if(!s)return null;
  var m=String(s).match(/(\d{4})[-.\/](\d{1,2})[-.\/](\d{1,2})/);
  if(m)return calFmt(+m[1],+m[2],+m[3]);
  var d=new Date(s);
  return(!isNaN(d.getTime())&&d.getFullYear()>=2020&&d.getFullYear()<=2100)?calFmt(d.getFullYear(),d.getMonth()+1,d.getDate()):null;
}

    var eid = employeeId.trim().toUpperCase();

    var dobDigits = (dob||'').replace(/\D/g,'');
    if(dobDigits.length!==6){setError('Please enter your date of birth as YYMMDD (6 digits).');return;}
    setLoading(true);setError('');
    callApi('verifyIdentity',{employeeId:eid,birthDate:dobDigits}).then(function(res){
      setLoading(false);
      if(res.success){setScreen('otp');setOtp('');setEmailCount(res.emailCount||1);}
      else{setError(res.message||'Verification failed.');}
    }).catch(function(){
      setLoading(false);setError('Network error. Please try again.');
    });

  function handleOtpVerify(){
    if(otp.length!==6){setError('Please enter the 6-digit code.');return;}
    var eid = employeeId.trim().toUpperCase();

      return loadPortalData(res.token).then(function(data){
        setLoading(false);
        if(data){setFaculty(data);if(data.isAdmin)setTab('admin');setScreen('portal');}
        else{sessionStorage.removeItem('portal_token');setError('Failed to load portal data.');}

  function CalendarCard(){
    var _ym=useState(null),ymOv=_ym[0],setYm=_ym[1];     // 'YYYY-MM' — null이면 기본 월
    var _sd=useState(null),selDay=_sd[0],setSelDay=_sd[1]; // 선택된 날짜 'YYYY-MM-DD'
    var entries=(faculty.calendar||[]).map(function(c){
      return {start:c.start,end:(c.end&&c.end>c.start)?c.end:null,title:c.title,description:c.description||'',category:c.category||'',rsvp:false};
    });
    (faculty.events||[]).forEach(function(ev){
      var d=calParseFree(ev.datetime);
      if(d)entries.push({start:d,end:null,title:ev.title,description:[ev.datetime,ev.location].filter(Boolean).join(' · '),category:'',rsvp:true});
    });
    if(entries.length===0)return null;
    entries.sort(function(a,b){return a.start<b.start?-1:1});

    // 분류 → 색 (등장 순서대로 팔레트 배정, RSVP 행사는 gold 고정)
    var cats=[];
    entries.forEach(function(e){if(!e.rsvp&&cats.indexOf(e.category)===-1)cats.push(e.category)});
    function catColor(e){return e.rsvp?T.gold:CAL_COLORS[cats.indexOf(e.category)%CAL_COLORS.length]}
    var hasRsvp=entries.some(function(e){return e.rsvp});
    var showLegend=hasRsvp||cats.length>1||(cats.length===1&&cats[0]);

    var now=new Date(),todayS=calFmt(now.getFullYear(),now.getMonth()+1,now.getDate());
    var minYm=entries[0].start.slice(0,7);
    var maxYm=entries.reduce(function(mx,e){var v=(e.end||e.start).slice(0,7);return v>mx?v:mx},minYm);
    var defYm=todayS.slice(0,7);if(defYm<minYm)defYm=minYm;if(defYm>maxYm)defYm=maxYm;
    var ym=ymOv||defYm;
    var y=+ym.slice(0,4),mo=+ym.slice(5,7);
    var dim=new Date(y,mo,0).getDate(),fdow=new Date(y,mo-1,1).getDay();
    var first=calFmt(y,mo,1),last=calFmt(y,mo,dim);

    function covers(e,dateS){return e.end?(e.start<=dateS&&dateS<=e.end):e.start===dateS}
    var monthEntries=entries.filter(function(e){return e.start<=last&&(e.end||e.start)>=first});
    // 기간 일정 → 레인 배정 (겹치면 아래 레인으로)
    var monthRanges=monthEntries.filter(function(e){return e.end});
    var laneEnds=[];
    monthRanges.forEach(function(e){
      var li=0;while(li<laneEnds.length&&laneEnds[li]>=e.start)li++;
      e.lane=li;laneEnds[li]=e.end;
    });
    var listEntries=selDay?entries.filter(function(e){return covers(e,selDay)}):monthEntries;
    function nav(delta){
      var m2=mo+delta,y2=y;
      if(m2<1){m2=12;y2--}if(m2>12){m2=1;y2++}
      setYm(y2+'-'+('0'+m2).slice(-2));setSelDay(null);
    }
    var navBtn={background:'none',border:'1px solid '+T.bdr,borderRadius:6,width:26,height:26,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',color:T.sub,padding:0};
    var cells=[];
    for(var b=0;b<fdow;b++)cells.push(null);
    for(var d=1;d<=dim;d++)cells.push(d);

    return h(Card,null,
      h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12,gap:8}},
        h('h3',{style:{fontSize:15,fontWeight:700,color:T.navy,margin:0}},'📅 Program Calendar'),
        h('div',{style:{display:'flex',alignItems:'center',gap:4}},
          h('button',{onClick:function(){nav(-1)},style:navBtn},Icons.chevL()),
          h('span',{style:{fontSize:13,fontWeight:700,color:T.text,minWidth:80,textAlign:'center'}},CAL_MONTHS[mo-1]+' '+y),
          h('button',{onClick:function(){nav(1)},style:navBtn},Icons.chevR()))),
      showLegend?h('div',{style:{display:'flex',flexWrap:'wrap',gap:'4px 12px',marginBottom:10}},
        cats.map(function(c,i){
          return h('span',{key:i,style:{display:'inline-flex',alignItems:'center',gap:5,fontSize:11,color:T.sub,fontWeight:600}},
            h('span',{style:{width:7,height:7,borderRadius:4,background:CAL_COLORS[i%CAL_COLORS.length],flexShrink:0}}),c||'Program');
        }),
        hasRsvp&&h('span',{style:{display:'inline-flex',alignItems:'center',gap:5,fontSize:11,color:T.sub,fontWeight:600}},
          h('span',{style:{width:7,height:7,borderRadius:4,background:T.gold,flexShrink:0}}),'Event (RSVP)')):null,
      h('div',{style:{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:2,marginBottom:2}},

      h('div',{style:{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:2}},

          var isSel=selDay===dateS,isToday=dateS===todayS;
          // 이 칸에서 시작하는 기간 밴드 세그먼트 (기간 시작일·주 시작·월 1일에서만 그려 주 단위로 이어붙임)
          var dow=(fdow+d-1)%7,segs=[];

  function DocumentsTab(){
    var contractDocKeys = {invitationLetter:1, businessRegistration:1};
    var contractDocs = (faculty.resources||[]).filter(function(r){return contractDocKeys[r.key]});

    // 재임용 서류 — REAPPOINTMENT_MODE='portal'이면 포털에서 직접 업로드받는다(동계~).
    // 'external'이면 기존처럼 외부 재임용 웹앱으로 링크만 건다(하계).
    var reapp = faculty.documents.reappointment || {};
    var _rd=useState(reapp.docTypes||[]),reappDocs=_rd[0],setReappDocs=_rd[1];
    var _rb=useState(''),reappBusy=_rb[0],setReappBusy=_rb[1];   // 업로드 중인 docType key
    var _rm=useState(''),reappMsg=_rm[0],setReappMsg=_rm[1];
    var reappDone = reappDocs.filter(function(d){return d.uploaded}).length;
    var reappStatus = reappDocs.length&&reappDone===reappDocs.length?'submitted':(reappDone>0?'partial':'pending');

    function onReappFile(docKey,e){
      var f=(e.target.files||[])[0];
      e.target.value='';
      if(!f) return;
      if(['application/pdf','image/jpeg','image/png'].indexOf(f.type)===-1){setReappMsg('Only PDF, JPG, or PNG files are allowed. / PDF·JPG·PNG만 업로드할 수 있습니다.');return;}
      if(f.size>10*1024*1024){setReappMsg('File exceeds the 10MB limit: '+f.name);return;}
      setReappMsg(''); setReappBusy(docKey);
      var reader=new FileReader();
      reader.onload=function(){
        var b64=String(reader.result).split(',')[1];
        callApi('uploadReappointmentFile',{token:sessionStorage.getItem('portal_token'),docType:docKey,file:{name:f.name,mimeType:f.type,data:b64}}).then(function(res){
          setReappBusy('');
          if(res.expired){handleLogout();return;}
          if(!res.success){setReappMsg(res.message||('Upload failed: '+f.name));return;}
          if(res.status&&res.status.docTypes) setReappDocs(res.status.docTypes);
        }).catch(function(){setReappBusy('');setReappMsg('Network error while uploading '+f.name);});

      for(var i=0;i<list.length;i++){

      }
      setFlightMsg(''); setFlightBusy(true);
      var token = sessionStorage.getItem('portal_token');
      var idx = 0;
      function next(){
        if(idx>=list.length){setFlightBusy(false);setFlightMsg('');return;}
        var f = list[idx];
        setFlightMsg('Uploading '+(idx+1)+' / '+list.length+' — '+f.name);
        var reader = new FileReader();
        reader.onload = function(){
          var b64 = String(reader.result).split(',')[1];

            idx++; next();
          }).catch(function(){setFlightBusy(false);setFlightMsg('Network error while uploading '+f.name);});

            return h('button',{key:t.key,onClick:function(){setTab(t.key);setSelNotice(null);},style:{display:'flex',alignItems:'center',gap:10,padding:'10px 14px',borderRadius:10,border:'none',background:tab===t.key?'rgba(0,55,100,.08)':'transparent',color:tab===t.key?T.navy:T.sub,fontSize:14,fontWeight:tab===t.key?600:400,cursor:'pointer',fontFamily:'inherit',textAlign:'left'}},
              t.icon(),' ',t.label);
          }))),
      // Main
      h('main',{style:{flex:1,padding:'20px 0 100px',minWidth:0,marginLeft:16}},
        h(tabContent[tab]))
    ),
    // Mobile Bottom Nav
    h('div',{className:'mob-hide',style:{position:'fixed',bottom:0,left:0,right:0,background:'#fff',borderTop:'1px solid '+T.bdr,display:'flex',justifyContent:'space-around',padding:'6px 0',zIndex:100}},
      tabs.map(function(t){
        return h('button',{key:t.key,onClick:function(){setTab(t.key);setSelNotice(null);},style:{display:'flex',flexDirection:'column',alignItems:'center',gap:2,background:'none',border:'none',padding:'6px 12px',color:tab===t.key?T.navy:T.sub,fontFamily:'inherit',fontSize:10,fontWeight:tab===t.key?600:400}},
          t.icon(),t.label);
      }))
  );
}

ReactDOM.render(React.createElement(App), document.getElementById('root'));
  </script>
</body>
</html>
