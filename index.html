const API_URL = 'https://script.google.com/macros/s/AKfycbz6UPrdXAZlEbUCUHXlE-8BDFNufruftlrx_MAuvfI7wezGjW4-AtPf_k1FuEgHv1wX/exec';
function callApi(action, payload){
  // No Content-Type header → avoids CORS preflight (Apps Script doesn't handle OPTIONS)
  return fetch(API_URL, {
    method:'POST',
    body: JSON.stringify(Object.assign({action:action}, payload||{}))
  }).then(function(r){return r.json()});
}

// Drive 파일을 Apps Script로 proxy 다운로드 (session 검증 후 base64 → blob 다운로드 트리거)
function downloadProxyFile(fileType){
  var token = (typeof sessionStorage!=='undefined') ? sessionStorage.getItem('portal_token') : null;
  return callApi('downloadFile', {token:token, fileType:fileType}).then(function(res){
    if(!res || !res.success){
      alert((res && res.message) || 'Download failed');
      return;
    }
    var bin = atob(res.data);
    var bytes = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    var blob = new Blob([bytes], {type: res.mimeType || 'application/octet-stream'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = res.fileName || 'download';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url);}, 1000);
  }).catch(function(err){
    alert('Download failed: ' + (err && err.message ? err.message : err));
  });
}

// 대시보드 + 공지를 동시에 로드해서 faculty state로 머지될 객체 반환 (실패 시 null)
function loadPortalData(token){
  return Promise.all([
    callApi('getDashboard',{token:token}),
    callApi('getNotices',{token:token}),
    callApi('getEvents',{token:token})
  ]).then(function(results){
    var dash=results[0], nx=results[1], ex=results[2];
    if(dash.expired||nx.expired||(ex&&ex.expired)) return null;
    if(!dash.success) return null;
    return Object.assign({},MOCK,dash.faculty,{
      notices:(nx.success&&nx.notices)?nx.notices:[],
      events:(ex&&ex.success&&ex.events)?ex.events:[],
      eventsOpen:!(ex&&ex.open===false),   // events_open=N 이면 Events 탭 숨김
      documents: dash.documents || MOCK.documents,
      courses: dash.courses || MOCK.courses,
      housing: dash.housing || MOCK.housing,
      resources: dash.resources || MOCK.resources,
      salary: dash.salary || MOCK.salary,
      flight: dash.flight || MOCK.flight,
      calendar: dash.calendar || MOCK.calendar,
    });
  });
}

// ── 서명 캔버스 ──
// 계약서 서명과 재임용 동의서 서명이 함께 쓴다. 세 가지 입력 방식:
//   draw   — 마우스·터치로 직접 서명 (Pointer Events)
//   type   — 이름을 타이핑하면 손글씨 폰트(Dancing Script)로 렌더
//   upload — 서명 이미지 파일(PNG/JPG) 업로드
// 어떤 방식이든 결과는 PNG dataURL 로 onChange 에 전달. 비어 있으면 null.
function SignaturePad(props){
  var canvasRef=useRef(null), drawingRef=useRef(false), dirtyRef=useRef(false);
  var _m=useState('type'),sigMode=_m[0],setSigMode=_m[1];
  var _t=useState(''),typed=_t[0],setTyped=_t[1];
  var _e=useState(''),sigErr=_e[0],setSigErr=_e[1];
  var onChange=props.onChange, disabled=props.disabled;

  // 캔버스 픽셀 크기를 표시 크기 × DPR 로 맞춘다 — 안 그러면 선이 뭉개진다.
  useEffect(function(){
    var cv=canvasRef.current; if(!cv) return;
    function fit(){
      var dpr=window.devicePixelRatio||1;
      var w=cv.clientWidth, hgt=cv.clientHeight;
      if(!w||!hgt) return;
      var prev=dirtyRef.current?cv.toDataURL('image/png'):null;
      cv.width=Math.round(w*dpr); cv.height=Math.round(hgt*dpr);
      var ctx=cv.getContext('2d');
      ctx.setTransform(dpr,0,0,dpr,0,0);
      ctx.lineWidth=2.2; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#1a1a2e';
      if(prev){ var img=new Image(); img.onload=function(){ctx.drawImage(img,0,0,w,hgt)}; img.src=prev; }
    }
    fit();
    window.addEventListener('resize',fit);
    return function(){window.removeEventListener('resize',fit)};
  },[]);

  function wipe(){
    var cv=canvasRef.current, ctx=cv.getContext('2d');
    var dpr=window.devicePixelRatio||1;
    ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height); ctx.restore();
    ctx.setTransform(dpr,0,0,dpr,0,0);
    dirtyRef.current=false;
  }
  // dataURL 이 서버 상한(500KB)에 걸리면 저해상도로 재인코딩해서 구제한다 (업로드 사진 대비).
  function emit(){
    if(!onChange) return;
    if(!dirtyRef.current){onChange(null);return;}
    var cv=canvasRef.current, data=cv.toDataURL('image/png');
    if(data.length>450000){
      var tmp=document.createElement('canvas');
      tmp.width=600; tmp.height=Math.round(600*cv.height/cv.width);
      tmp.getContext('2d').drawImage(cv,0,0,tmp.width,tmp.height);
      data=tmp.toDataURL('image/png');
      if(data.length>450000){setSigErr('Image is too complex. Please use a simpler signature image. / 이미지가 너무 큽니다.');onChange(null);return;}
    }
    setSigErr('');
    onChange(data);
  }
  function clearAll(){
    wipe(); setTyped(''); setSigErr('');
    if(onChange) onChange(null);
  }
  function switchMode(m){
    if(disabled||m===sigMode) return;
    setSigMode(m); clearAll();
  }

  // draw 모드
  function pos(e){var r=canvasRef.current.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
  function pStart(e){
    if(disabled||sigMode!=='draw') return;
    e.preventDefault();
    var cv=canvasRef.current, ctx=cv.getContext('2d'), p=pos(e);
    drawingRef.current=true;
    try{cv.setPointerCapture(e.pointerId)}catch(err){}
    ctx.beginPath(); ctx.moveTo(p.x,p.y);
    ctx.lineTo(p.x+0.01,p.y+0.01); ctx.stroke();
    dirtyRef.current=true;
  }
  function pMove(e){
    if(disabled||sigMode!=='draw'||!drawingRef.current) return;
    e.preventDefault();
    var ctx=canvasRef.current.getContext('2d'), p=pos(e);
    ctx.lineTo(p.x,p.y); ctx.stroke();
  }
  function pEnd(e){
    if(!drawingRef.current) return;
    drawingRef.current=false;
    try{canvasRef.current.releasePointerCapture(e.pointerId)}catch(err){}
    emit();
  }

  // type 모드 — 손글씨 폰트로 렌더. 폰트 로딩이 끝난 뒤 다시 그린다.
  function renderTyped(text){
    setTyped(text);
    var cv=canvasRef.current;
    function draw(){
      wipe();
      var t=text.trim();
      if(t){
        var ctx=cv.getContext('2d');
        var size=54;
        ctx.font='600 '+size+'px "Dancing Script", cursive';
        while(size>22 && ctx.measureText(t).width > cv.clientWidth-48){size-=4;ctx.font='600 '+size+'px "Dancing Script", cursive';}
        ctx.fillStyle='#1a1a2e';
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(t, cv.clientWidth/2, cv.clientHeight/2-8);
        dirtyRef.current=true;
      }
      emit();
    }
    if(document.fonts&&document.fonts.load){document.fonts.load('600 54px "Dancing Script"').then(draw).catch(draw);}
    else draw();
  }

  // upload 모드 — 캔버스에 맞춰 그려 PNG 로 정규화
  function onUpload(e){
    var f=(e.target.files||[])[0];
    e.target.value='';
    if(!f) return;
    if(['image/png','image/jpeg'].indexOf(f.type)===-1){setSigErr('PNG or JPG only. / PNG·JPG만 가능합니다.');return;}
    if(f.size>5*1024*1024){setSigErr('File exceeds 5MB. / 5MB 이하로 올려주세요.');return;}
    var reader=new FileReader();
    reader.onload=function(){
      var img=new Image();
      img.onload=function(){
        wipe();
        var cv=canvasRef.current, ctx=cv.getContext('2d');
        var maxW=cv.clientWidth-24, maxH=cv.clientHeight-24;
        var sc=Math.min(maxW/img.width, maxH/img.height, 1);
        var w=img.width*sc, hh=img.height*sc;
        ctx.drawImage(img,(cv.clientWidth-w)/2,(cv.clientHeight-hh)/2,w,hh);
        dirtyRef.current=true;
        emit();
      };
      img.onerror=function(){setSigErr('Could not read the image. / 이미지를 읽을 수 없습니다.')};
      img.src=String(reader.result);
    };
    reader.readAsDataURL(f);
  }

  var tabs=[['type','\u2328 Type \ud0c0\uc774\ud551'],['upload','\ud83d\uddbc Upload \uc774\ubbf8\uc9c0'],['draw','\u270d Draw \uc9c1\uc811 \uc11c\uba85']];
  return h('div',null,
    h('div',{style:{display:'flex',gap:6,marginBottom:8}},
      tabs.map(function(tb){
        var active=sigMode===tb[0];
        return h('button',{key:tb[0],type:'button',onClick:function(){switchMode(tb[0])},disabled:disabled,
          style:{padding:'6px 12px',background:active?T.navy:'#fff',color:active?'#fff':T.sub,border:'1px solid '+(active?T.navy:T.bdr),borderRadius:8,fontSize:12,fontWeight:600,fontFamily:'inherit',cursor:disabled?'not-allowed':'pointer'}},tb[1]);
      })),
    sigMode==='type'&&h('input',{value:typed,disabled:disabled,onChange:function(e){renderTyped(e.target.value)},placeholder:'Type your full name / \uc774\ub984\uc744 \uc785\ub825\ud558\uc138\uc694',
      style:{width:'100%',padding:'8px 10px',border:'1px solid '+T.bdr,borderRadius:8,fontSize:13,fontFamily:'inherit',marginBottom:8}}),
    sigMode==='upload'&&h('label',{style:{display:'inline-flex',alignItems:'center',gap:6,padding:'8px 14px',background:disabled?'#9ca3af':T.navy,color:'#fff',borderRadius:8,fontSize:12,fontWeight:600,cursor:disabled?'not-allowed':'pointer',marginBottom:8}},
      'Choose signature image \u2191',
      h('input',{type:'file',accept:'.png,.jpg,.jpeg,image/png,image/jpeg',disabled:disabled,onChange:onUpload,style:{display:'none'}})),
    h('div',{style:{position:'relative',border:'1px solid '+T.bdr,borderRadius:10,background:disabled?'#f8f9fb':'#fff',overflow:'hidden'}},
      h('canvas',{ref:canvasRef,
        onPointerDown:pStart,onPointerMove:pMove,onPointerUp:pEnd,onPointerLeave:pEnd,onPointerCancel:pEnd,
        style:{display:'block',width:'100%',height:170,touchAction:'none',cursor:(disabled||sigMode!=='draw')?'default':'crosshair'}}),
      h('div',{style:{position:'absolute',left:24,right:24,bottom:44,borderBottom:'1px dashed '+T.bdr,pointerEvents:'none'}}),
      h('div',{style:{position:'absolute',left:24,bottom:22,fontSize:11,color:T.sub,pointerEvents:'none'}},
        sigMode==='draw'?'Sign above / \uc704\uc5d0 \uc11c\uba85\ud574 \uc8fc\uc138\uc694':(sigMode==='type'?'Preview / \ubbf8\ub9ac\ubcf4\uae30':'Uploaded image preview / \uc5c5\ub85c\ub4dc \ubbf8\ub9ac\ubcf4\uae30'))),
    sigErr&&h('div',{style:{marginTop:6,fontSize:12,color:T.red}},sigErr),
    h('div',{style:{display:'flex',justifyContent:'flex-end',marginTop:8}},
      h('button',{type:'button',onClick:clearAll,disabled:disabled,
        style:{padding:'6px 14px',background:'#fff',color:T.sub,border:'1px solid '+T.bdr,borderRadius:6,fontSize:12,fontWeight:600,fontFamily:'inherit',cursor:disabled?'not-allowed':'pointer'}},'Clear'))
  );
}

// ── Program Calendar helpers ──
var CAL_MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
// 분류별 색 팔레트 — 시트 E열의 분류가 등장 순서대로 색을 배정받음 (같은 분류 = 같은 색)
var CAL_COLORS=['#2563eb','#db2777','#0d9668','#7c3aed','#0891b2','#d97706'];
function calAlpha(hex,a){return 'rgba('+parseInt(hex.slice(1,3),16)+','+parseInt(hex.slice(3,5),16)+','+parseInt(hex.slice(5,7),16)+','+a+')'}
function calFmt(y,m,d){return y+'-'+('0'+m).slice(-2)+'-'+('0'+d).slice(-2)}
function calLabel(s){var p=s.split('-');return CAL_MONTHS[+p[1]-1]+' '+(+p[2])}
// RSVP 행사 일시(자유 텍스트) → YYYY-MM-DD 베스트에포트 파싱. 실패 시 null(달력에서 제외).
function calParseFree(s){
  if(!s)return null;
  var m=String(s).match(/(\d{4})[-.\/](\d{1,2})[-.\/](\d{1,2})/);
  if(m)return calFmt(+m[1],+m[2],+m[3]);
  var d=new Date(s);
  return(!isNaN(d.getTime())&&d.getFullYear()>=2020&&d.getFullYear()<=2100)?calFmt(d.getFullYear(),d.getMonth()+1,d.getDate()):null;
}

  function CalendarCard(){

    var first=calFmt(y,mo,1),last=calFmt(y,mo,dim);

    var monthRanges=monthEntries.filter(function(e){return e.end});
    var laneEnds=[];
    monthRanges.forEach(function(e){

          var isSel=selDay===dateS,isToday=dateS===todayS;

          var dow=(fdow+d-1)%7,segs=[];

            if(!covers(e,dateS)||!(e.start===dateS||dow===0||d===1))return;

    function onFlightFiles(e){
      var list = Array.prototype.slice.call(e.target.files||[]);

      var allowed = ['application/pdf','image/jpeg','image/png'];
      for(var i=0;i<list.length;i++){

      }
      setFlightMsg(''); setFlightBusy(true);
      var token = sessionStorage.getItem('portal_token');
      var idx = 0;
      function next(){
        if(idx>=list.length){setFlightBusy(false);setFlightMsg('');return;}
        var f = list[idx];
        setFlightMsg('Uploading '+(idx+1)+' / '+list.length+' — '+f.name);
        var reader = new FileReader();
        reader.onload = function(){
          var b64 = String(reader.result).split(',')[1];
          callApi('uploadFlightFile',{token:token,file:{name:f.name,mimeType:f.type,data:b64}}).then(function(res){
            if(res.expired){handleLogout();return;}
            if(!res.success){setFlightBusy(false);setFlightMsg(res.message||('Upload failed: '+f.name));return;}
            setFlightFiles(res.files||[]);
            idx++; next();
          }).catch(function(){setFlightBusy(false);setFlightMsg('Network error while uploading '+f.name);});

            h('strong',null,'Form locked. '),'Your submission has been received',status.submittedAt?(' on '+status.submittedAt):'','. To correct any information, please contact ',h('a',{href:'mailto:'+(salary.contactEmail||''),style:{color:T.green,fontWeight:600}},salary.contactEmail||'isummer@yonsei.ac.kr'),'.')
        : h('button',{onClick:submit,disabled:saving,style:S(btnPrimary,{opacity:saving?.7:1,maxWidth:260,alignSelf:'flex-start'})},
            saving ? 'Saving…' : 'Submit'
          ),
      flightCard
    );
  }

  var tabContent={dashboard:DashboardTab,courses:CoursesTab,documents:DocumentsTab,notices:NoticesTab,admin:AdminTab,salary:SalaryTab,events:EventsTab};

  return h('div',{style:{minHeight:'100vh',background:T.bg,fontFamily:"'Noto Sans',-apple-system,sans-serif"}},
    fadeStyle,
    // Top Nav
    h('nav',{style:{background:T.navy,padding:'0 24px',display:'flex',alignItems:'center',justifyContent:'space-between',height:56,position:'sticky',top:0,zIndex:100}},
      h('div',{style:{display:'flex',alignItems:'center',gap:12}},
        h('span',{style:{fontSize:20}},'🏛️'),
        h('span',{style:{color:'#fff',fontSize:15,fontWeight:700,fontFamily:"'Playfair Display',serif"}},'WAY Faculty Portal')),
      h('div',{style:{display:'flex',alignItems:'center',gap:16}},
        h('span',{style:{color:'rgba(255,255,255,.7)',fontSize:13}},faculty.name),
        h('button',{onClick:handleLogout,style:{background:'rgba(255,255,255,.1)',border:'none',borderRadius:8,padding:'6px 12px',color:'rgba(255,255,255,.8)',display:'flex',alignItems:'center',gap:6,fontSize:12,fontFamily:'inherit',fontWeight:500}},
          Icons.logout(),' Sign Out'))
    ),
    h('div',{style:{display:'flex',maxWidth:1100,margin:'0 auto',padding:'0 16px'}},
      // Sidebar
      h('aside',{className:'desk-show',style:{width:220,padding:'20px 0',flexShrink:0,position:'sticky',top:56,height:'calc(100vh - 56px)',display:'none'}},
        h('div',{style:{display:'flex',flexDirection:'column',gap:4}},
          tabs.map(function(t){
            return h('button',{key:t.key,onClick:function(){setTab(t.key);setSelNotice(null);},style:{display:'flex',alignItems:'center',gap:10,padding:'10px 14px',borderRadius:10,border:'none',background:tab===t.key?'rgba(0,55,100,.08)':'transparent',color:tab===t.key?T.navy:T.sub,fontSize:14,fontWeight:tab===t.key?600:400,cursor:'pointer',fontFamily:'inherit',textAlign:'left'}},
              t.icon(),' ',t.label);
          }))),
      // Main
      h('main',{style:{flex:1,padding:'20px 0 100px',minWidth:0,marginLeft:16}},
        h(tabContent[tab]))
    ),
    // Mobile Bottom Nav
    h('div',{className:'mob-hide',style:{position:'fixed',bottom:0,left:0,right:0,background:'#fff',borderTop:'1px solid '+T.bdr,display:'flex',justifyContent:'space-around',padding:'6px 0',zIndex:100}},
      tabs.map(function(t){
        return h('button',{key:t.key,onClick:function(){setTab(t.key);setSelNotice(null);},style:{display:'flex',flexDirection:'column',alignItems:'center',gap:2,background:'none',border:'none',padding:'6px 12px',color:tab===t.key?T.navy:T.sub,fontFamily:'inherit',fontSize:10,fontWeight:tab===t.key?600:400}},
          t.icon(),t.label);
      }))
  );
}

ReactDOM.render(React.createElement(App), document.getElementById('root'));
  </script>
</body>
</html>
